<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="포트폴리오 구성과 프로젝트 소개 페이지를 연습하는 공간입니다.">
  <title>Portfolio Lab</title>
  <link rel="stylesheet" href="./assets/lab-style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로 가기</a>
  <header class="site-header">
    <div class="container header-inner">
    <a class="brand" href="./lab.html">Portfolio Lab</a>
    <nav aria-label="주 메뉴"><a href="#demos">데모 목록</a></nav>
    </div>
  </header>
  <main id="main">
    <section class="container lab-hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">포트폴리오 연습실</h1>
        <p class="lead">소개 페이지와 프로젝트 상세 페이지를 직접 수정해 볼 수 있는 두 가지 예제입니다.</p>
      </div>
      <a class="button" href="#demos">데모 살펴보기</a>
    </section>
    <section id="demos" class="container samples" aria-labelledby="demos-title">
      <h2 id="demos-title">연습용 데모</h2>
      <div class="cards">
        <article class="sample-card sample-blue">
          <div class="preview preview-profile" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="card-copy">
            <h3><a href="./demo-01/">연구 포트폴리오</a></h3>
            <p>첫 화면, 관심 분야, 프로젝트 목록을 담은 한 페이지 소개 사이트입니다.</p>
          </div>
        </article>
        <article class="sample-card sample-green">
          <div class="preview preview-case" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="card-copy">
            <h3><a href="./demo-02/">프로젝트 사례</a></h3>
            <p>문제, 구현 흐름, 검증 계획을 보여주는 사례 연구 페이지입니다.</p>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
